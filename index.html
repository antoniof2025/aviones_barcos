<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasificador de Imágenes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: #f4f4f4;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, #0078D7 60%, #00bcf2 100%);
      padding: 32px 20px 24px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header p {
      margin: 12px 0 0;
      font-size: 1.15rem;
      color: #e0e0e0;
      font-weight: 400;
    }
    .section {
      padding: 36px 24px;
      background: rgba(43,43,43,0.98);
      margin: 32px auto;
      max-width: 900px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      backdrop-filter: blur(2px);
    }
    .button {
      display: inline-flex;
      align-items: center;
      margin: 10px 8px 10px 0;
      padding: 14px 26px;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #0078D7 60%, #00bcf2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,120,215,0.15);
      transition: background 0.3s, transform 0.2s, box-shadow 0.2s;
      outline: none;
      gap: 8px;
    }
    .button:hover, .button:focus {
      background: linear-gradient(90deg, #005a9e 60%, #00a4c6 100%);
      transform: translateY(-2px) scale(1.06);
      box-shadow: 0 6px 18px rgba(0,120,215,0.25);
    }
    .button i {
      margin-right: 10px;
      font-size: 1.2em;
    }
    .section-group {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    @media (min-width: 800px) {
      .section-group {
        flex-direction: row;
        gap: 48px;
        justify-content: space-between;
      }
      .section-group > div {
        flex: 1 1 0;
      }
    }
    h2 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: #00bcf2;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }
    #label-container {
      margin-top: 20px;
    }
    .prediction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #3a3a3a 70%, #232526 100%);
      border-radius: 12px;
      padding: 14px 18px;
      margin: 12px 0;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      border: 1px solid #2b2b2b;
      transition: box-shadow 0.2s;
    }
    .prediction:hover {
      box-shadow: 0 4px 16px rgba(0,188,242,0.10);
    }
    .prediction .label {
      flex: 1;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }
    .prediction .bar-container {
      flex: 2;
      margin-left: 24px;
      background: #444;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      height: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }
    .prediction .bar {
      height: 24px;
      background: linear-gradient(90deg, #00bcf2 60%, #0078D7 100%);
      text-align: right;
      line-height: 24px;
      color: #fff;
      padding-right: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: width 0.5s cubic-bezier(.4,2,.6,1), background 0.3s;
      border-radius: 6px 0 0 6px;
      box-shadow: 0 1px 4px rgba(0,120,215,0.10);
    }
    #webcam-container, #image-preview-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
      gap: 16px;
    }
    #webcam-container canvas, #image-preview-container canvas {
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,188,242,0.10);
      border: 2px solid #00bcf2;
      background: #232526;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      transition: box-shadow 0.2s;
    }
    input[type="file"] {
      display: none;
    }
    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
      width: 10px;
      background: #232526;
    }
    ::-webkit-scrollbar-thumb {
      background: #0078D7;
      border-radius: 8px;
    }
    ::selection {
      background: #00bcf2;
      color: #fff;
    }
  </style>
</head>
<body>
<header>
  <h1>Clasificador de Imágenes</h1>
  <p>Clasifica imágenes con la cámara o desde tu galería usando inteligencia artificial.</p>
</header>
<section class="section">
  <div class="section-group">
    <div>
      <h2>Cámara y Galería</h2>
      <button class="button" onclick="startWebcam('user')"><i class="fas fa-camera"></i> Cámara Frontal</button>
      <button class="button" onclick="startWebcam('environment')"><i class="fas fa-camera-retro"></i> Cámara Trasera</button>
      <label for="image-upload" class="button"><i class="fas fa-upload"></i> Subir Imagen</label>
      <input type="file" accept="image/*" id="image-upload" />
      <button id="take-photo-btn" class="button" style="display:none;margin-top:10px;"><i class="fas fa-circle"></i> Tomar Foto</button>
    </div>

    <div>
      <h2>Vista Previa</h2>
      <div id="webcam-container"></div>
      <div id="image-preview-container"></div>
    </div>

    <div>
      <h2>Resultados</h2>
      <div id="label-container"></div>
    </div>
  </div>

  <div style="margin-top:32px;">
    <h2>Historial de Clasificaciones</h2>
    <button class="button" onclick="exportarTablaExcel()"><i class="fas fa-file-excel"></i> Exportar a Excel</button>
    <table id="tabla-resultados" style="width:100%;margin-top:16px;background:#232526;border-radius:10px;overflow:hidden;">
      <thead>
        <tr style="background:#0078D7;">
          <th style="padding:8px;">Nombre de la Foto</th>
          <th style="padding:8px;">Resultado</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
  const URL = "./my_model/";
  let model, webcam, labelContainer, maxPredictions;
  let webcamMode = 'user';

  async function loadModel() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();
    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
      const div = document.createElement("div");
      div.classList.add("prediction");
      div.innerHTML = `
        <div class="label">Clase ${i + 1}</div>
        <div class="bar-container"><div class="bar" style="width: 0%">0%</div></div>
      `;
      labelContainer.appendChild(div);
    }
  }

  async function startWebcam(facingMode = 'user') {
    webcamMode = facingMode;
    // Solo carga el modelo si no está cargado
    if (!model) await loadModel();
    if (webcam) {
      try { webcam.stop(); } catch (e) {}
    }
    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup({ facingMode });
    await webcam.play();
    window.requestAnimationFrame(loop);
    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    // Limpiar la vista previa al iniciar la cámara
    document.getElementById("image-preview-container").innerHTML = "";

    // Mostrar botón solo si es cámara trasera
    document.getElementById("take-photo-btn").style.display = (facingMode === 'environment') ? "inline-flex" : "none";
  }

  async function loop() {
    webcam.update();
    await predict(webcam.canvas);
    window.requestAnimationFrame(loop);
  }

  async function predict(input) {
    const prediction = await model.predict(input);
    for (let i = 0; i < maxPredictions; i++) {
      const p = prediction[i];
      const percent = (p.probability * 100).toFixed(1);
      const bar = labelContainer.children[i].querySelector(".bar");
      const label = labelContainer.children[i].querySelector(".label");
      label.textContent = `${p.className}`;
      bar.style.width = `${percent}%`;
      bar.textContent = `${percent}%`;
    }
  }

  // Historial de resultados
  let historialResultados = [];

  // Añade una fila a la tabla
  function agregarAFilaHistorial(nombre, resultado) {
    historialResultados.push({nombre, resultado});
    const tbody = document.getElementById("tabla-resultados").querySelector("tbody");
    const tr = document.createElement("tr");
    tr.innerHTML = `<td style="padding:8px;">${nombre}</td><td style="padding:8px;">${resultado}</td>`;
    tbody.appendChild(tr);
  }

  // Exportar a Excel (CSV)
  function exportarTablaExcel() {
    let csv = "Nombre de la Foto,Resultado\n";
    historialResultados.forEach(row => {
      csv += `"${row.nombre}","${row.resultado}"\n`;
    });
    const blob = new Blob([csv], { type: "text/csv" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "historial_clasificaciones.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
  }

  async function classifyImage(img, nombre = "Imagen subida") {
    const canvas = document.createElement("canvas");
    canvas.width = 200;
    canvas.height = 200;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    document.getElementById("image-preview-container").innerHTML = "";
    document.getElementById("image-preview-container").appendChild(canvas);
    const resultado = await predictAndReturn(canvas);
    agregarAFilaHistorial(nombre, resultado);
  }

  // Modifica el evento de subida de imagen para pasar el nombre del archivo
  document.getElementById("image-upload").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (file) {
      if (!model) await loadModel();
      const reader = new FileReader();
      reader.onload = async function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async function () {
          await classifyImage(img, file.name);
        };
      };
      reader.readAsDataURL(file);
    }
  });

  // Botón para tomar foto con cámara trasera
  document.getElementById("take-photo-btn").addEventListener("click", async () => {
    if (webcam && webcamMode === 'environment') {
      const photoCanvas = document.createElement("canvas");
      photoCanvas.width = 200;
      photoCanvas.height = 200;
      const ctx = photoCanvas.getContext("2d");
      ctx.drawImage(webcam.canvas, 0, 0, 200, 200);

      // Descargar la foto automáticamente (solo funcionará en algunos navegadores Android)
      const filename = `foto_camara_${Date.now()}.png`;
      const dataUrl = photoCanvas.toDataURL("image/png");
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;

      // Intentar descarga automática
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Mostrar enlace manual si la descarga automática falla (Android)
      setTimeout(() => {
        // Elimina enlaces anteriores si existen
        const prev = document.getElementById("descarga-manual-foto");
        if (prev) prev.remove();
        // Muestra el enlace manual
        const descargaDiv = document.createElement('div');
        descargaDiv.id = "descarga-manual-foto";
        descargaDiv.style.margin = "16px 0";
        descargaDiv.innerHTML = `
          <a href="${dataUrl}" download="${filename}" style="color:#00bcf2;font-weight:bold;font-size:1.1em;">
            Pulsa aquí si la foto no se descargó automáticamente
          </a>
        `;
        document.getElementById("image-preview-container").prepend(descargaDiv);
      }, 500);

      webcam.stop();
      document.getElementById("webcam-container").innerHTML = "";

      document.getElementById("image-preview-container").innerHTML = "";
      document.getElementById("image-preview-container").appendChild(photoCanvas);
      const resultado = await predictAndReturn(photoCanvas);
      agregarAFilaHistorial("Foto cámara", resultado);
    }
  });

  // Nueva función para obtener el resultado principal como texto
  async function predictAndReturn(input) {
    const prediction = await model.predict(input);
    let maxProb = 0;
    let resultado = "";
    for (let i = 0; i < maxPredictions; i++) {
      const p = prediction[i];
      const percent = (p.probability * 100).toFixed(1);
      const bar = labelContainer.children[i].querySelector(".bar");
      const label = labelContainer.children[i].querySelector(".label");
      label.textContent = `${p.className}`;
      bar.style.width = `${percent}%`;
      bar.textContent = `${percent}%`;
      if (p.probability > maxProb) {
        maxProb = p.probability;
        resultado = `${p.className} (${percent}%)`;
      }
    }
    return resultado;
  }
</script>
</body>
</html>
