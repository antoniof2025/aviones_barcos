<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasificador de Imágenes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #1f1f1f;
      color: #ffffff;
    }
    header {
      background: #0078D7;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    header p {
      margin: 10px 0 0;
      font-size: 1rem;
    }
    .section {
      padding: 30px;
      background: #2b2b2b;
      margin: 20px auto;
      max-width: 800px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .button {
      display: inline-flex;
      align-items: center;
      margin: 10px;
      padding: 12px 20px;
      font-size: 16px;
      background-color: #0078D7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .button:hover {
      background-color: #005a9e;
      transform: scale(1.05);
    }
    .button i {
      margin-right: 8px;
    }
    .section-group {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    #label-container {
      margin-top: 20px;
    }
    .prediction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #3a3a3a;
      border-radius: 10px;
      padding: 12px 16px;
      margin: 10px 0;
      font-weight: bold;
    }
    .prediction .label {
      flex: 1;
    }
    .prediction .bar-container {
      flex: 2;
      margin-left: 20px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }
    .prediction .bar {
      height: 20px;
      background: #00bcf2;
      text-align: right;
      line-height: 20px;
      color: #fff;
      padding-right: 5px;
      font-size: 14px;
    }
    #webcam-container, #image-preview-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
<header>
  <h1>Clasificador de Imágenes</h1>
  <p>Clasifica imágenes con la cámara o desde tu galería usando inteligencia artificial.</p>
</header>
<section class="section">
  <div class="section-group">
    <div>
      <h2>Cámara y Galería</h2>
      <button class="button" onclick="startWebcam('user')"><i class="fas fa-camera"></i> Cámara Frontal</button>
      <button class="button" onclick="startWebcam('environment')"><i class="fas fa-camera-retro"></i> Cámara Trasera</button>
      <label for="image-upload" class="button"><i class="fas fa-upload"></i> Subir Imagen</label>
      <input type="file" accept="image/*" id="image-upload" />
    </div>

    <div>
      <h2>Vista Previa</h2>
      <div id="webcam-container"></div>
      <div id="image-preview-container"></div>
    </div>

    <div>
      <h2>Resultados</h2>
      <div id="label-container"></div>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
  const URL = "./my_model/";
  let model, webcam, labelContainer, maxPredictions;

  async function loadModel() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();
    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
      const div = document.createElement("div");
      div.classList.add("prediction");
      div.innerHTML = `
        <div class="label">Clase ${i + 1}</div>
        <div class="bar-container"><div class="bar" style="width: 0%">0%</div></div>
      `;
      labelContainer.appendChild(div);
    }
  }

  async function startWebcam(facingMode = 'user') {
    await loadModel();
    if (webcam) webcam.stop();
    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup({ facingMode });
    await webcam.play();
    window.requestAnimationFrame(loop);
    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("webcam-container").appendChild(webcam.canvas);
  }

  async function loop() {
    webcam.update();
    await predict(webcam.canvas);
    window.requestAnimationFrame(loop);
  }

  async function predict(input) {
    const prediction = await model.predict(input);
    for (let i = 0; i < maxPredictions; i++) {
      const p = prediction[i];
      const percent = (p.probability * 100).toFixed(1);
      const bar = labelContainer.children[i].querySelector(".bar");
      const label = labelContainer.children[i].querySelector(".label");
      label.textContent = `${p.className}`;
      bar.style.width = `${percent}%`;
      bar.textContent = `${percent}%`;
    }
  }

  document.getElementById("image-upload").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (file) {
      if (!model) await loadModel();
      const reader = new FileReader();
      reader.onload = async function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async function () {
          await classifyImage(img);
        };
      };
      reader.readAsDataURL(file);
    }
  });

  async function classifyImage(img) {
    const canvas = document.createElement("canvas");
    canvas.width = 200;
    canvas.height = 200;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    document.getElementById("image-preview-container").innerHTML = "";
    document.getElementById("image-preview-container").appendChild(canvas);
    await predict(canvas);
  }
</script>
</body>
</html>
